    <text x="154" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#101828">E-Commerce D2C</text>
    <text x="240" y="22" font-family="'DM Mono', monospace" font-size="9" font-weight="700" fill="#10B981">₹14.8 Cr</text>

    <rect x="280" y="0" width="132" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="294" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#101828">Multi-City Healthcare</text>
    <text x="390" y="22" font-family="'DM Mono', monospace" font-size="9" font-weight="700" fill="#2878E5">140+</text>
